<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>MGT 816 · In-class poll</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --navy: #00356B;
      --ink: #1a1a1a;
      --muted: #5c6770;
      --line: #d5dde6;
      --bg: #eef1f4;
      --card: #fff;
      --ok: #157347;
      --bad: #b02a37;
      --pick: #286DC0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      background: var(--navy);
      color: #fff;
      padding: 0.85rem 1rem calc(0.85rem + env(safe-area-inset-top));
      padding-top: calc(0.85rem + env(safe-area-inset-top));
    }
    header .kicker { font-size: 0.78rem; opacity: 0.85; letter-spacing: 0.02em; }
    header h1 { margin: 0.15rem 0 0; font: 650 1.25rem Georgia, "Times New Roman", serif; }
    header .sub { margin-top: 0.25rem; font-size: 0.88rem; opacity: 0.92; }
    main { max-width: 32rem; margin: 0 auto; padding: 0.9rem 0.85rem 2.5rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.95rem 1rem;
      margin-bottom: 0.75rem;
    }
    .msg { color: var(--muted); line-height: 1.4; }
    .msg strong { color: var(--ink); }
    .err { color: var(--bad); font-weight: 650; margin-top: 0.55rem; }
    input[type="search"], input[type="text"] {
      width: 100%;
      min-height: 2.75rem;
      font: inherit;
      padding: 0.5rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .names { list-style: none; margin: 0.55rem 0 0; padding: 0; }
    .names button {
      width: 100%;
      text-align: left;
      min-height: 2.85rem;
      margin-bottom: 0.35rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font: 650 1rem inherit;
      cursor: pointer;
    }
    .names button:active { background: #e8eef5; }
    .who {
      display: flex; justify-content: space-between; gap: 0.5rem;
      align-items: baseline; margin-bottom: 0.65rem; font-size: 0.9rem;
    }
    .who button, .linkish {
      border: 0; background: none; color: var(--navy); font: 650 0.88rem inherit;
      cursor: pointer; text-decoration: underline;
    }
    .q { margin-bottom: 1.15rem; }
    .q h2 { font-size: 1.02rem; margin: 0 0 0.45rem; line-height: 1.35; }
    .q .n { color: var(--navy); font-weight: 700; }
    .opt {
      display: block; width: 100%; text-align: left;
      min-height: 2.9rem; margin-bottom: 0.35rem;
      padding: 0.6rem 0.7rem; border-radius: 8px;
      border: 1px solid var(--line); background: #fff;
      font: 500 0.95rem inherit; cursor: pointer;
    }
    .opt.on { border-color: var(--navy); background: #e7eef6; font-weight: 700; }
    .opt .ltr {
      display: inline-block; width: 1.35rem; font-weight: 700; color: var(--navy);
    }
    .bar {
      position: sticky; bottom: 0; background: var(--bg);
      padding: 0.65rem 0 calc(0.65rem + env(safe-area-inset-bottom));
    }
    .bar button, .primary {
      width: 100%; min-height: 3rem; border: 0; border-radius: 10px;
      background: var(--navy); color: #fff; font: 700 1.05rem inherit; cursor: pointer;
    }
    .bar button:disabled, .primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .ok { color: var(--ok); font-weight: 650; }
    .wait { text-align: center; padding: 1.2rem 0.4rem; color: var(--muted); }
    .count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.88rem; margin-bottom: 0.4rem; }
  </style>
</head>
<body>
  <header>
    <div class="kicker">MGT 816 · The Private Firm CFO</div>
    <h1>In-class poll</h1>
    <div class="sub" id="hdr">Enter your NetID and the session number, then vote.</div>
  </header>
  <main id="app"></main>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-database-compat.js"></script>
  <script>
(function () {
  const cfg = window.MGT816_FIREBASE || {};
  const WHO = "mgt816-vote-who-v1";
  const LETTERS = ["A", "B", "C", "D"];
  const appEl = document.getElementById("app");
  const hdr = document.getElementById("hdr");

  let polls = null;
  let db = null;
  let id = "";
  let ses = null;
  let answers = {};
  let saved = {};
  let err = "";

  function md(t) {
    return String(t || "").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }
  function cleanId(raw) {
    let t = String(raw || "").trim().toLowerCase();
    if (t.endsWith("@yale.edu")) t = t.slice(0, -9);
    return t;
  }
  function findSession(raw) {
    const t = String(raw || "").trim().toUpperCase().replace(/^S/, "");
    if (!/^\d{1,2}$/.test(t)) return null;
    const want = "S" + t.padStart(2, "0");
    return polls.sessions.find(x => x.id === want) || null;
  }
  function store(key) { return "mgt816-vote-" + key + "-" + id; }
  function loadLocal() {
    try { answers = JSON.parse(localStorage.getItem(store(ses.id)) || "{}") || {}; } catch (e) { answers = {}; }
    saved = Object.assign({}, answers);
  }
  function saveLocal() {
    try { localStorage.setItem(store(ses.id), JSON.stringify(saved)); } catch (e) {}
  }

  function renderStart() {
    hdr.textContent = "Enter your NetID and the session number, then vote.";
    const qs = new URLSearchParams(location.search);
    let remembered = "";
    try { remembered = localStorage.getItem(WHO) || ""; } catch (e) {}
    let html = '<div class="card">';
    html += '<p class="msg">Your NetID is your Canvas login, not your email.</p>';
    html += '<input id="nid" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="NetID">';
    html += '<p class="msg" style="margin-top:0.8rem">Session number (it is on the slide).</p>';
    html += '<input id="sn" type="text" inputmode="numeric" placeholder="Session number, e.g. 8">';
    if (err) html += '<p class="err">' + err + "</p>";
    html += '<div style="margin-top:0.8rem"><button type="button" class="primary" id="go">Start</button></div>';
    html += "</div>";
    appEl.innerHTML = html;
    const nid = document.getElementById("nid");
    const sn = document.getElementById("sn");
    nid.value = id || remembered;
    sn.value = ses ? String(Number(ses.id.slice(1))) : (qs.get("s") || "");
    (nid.value ? sn : nid).focus();
    function go() {
      const v = cleanId(nid.value);
      if (!/^[a-z][a-z0-9]{1,11}$/.test(v)) {
        err = "Enter your NetID (letters and numbers, no @yale.edu).";
        renderStart();
        return;
      }
      const found = findSession(sn.value);
      if (!found) {
        err = "There is no session " + (sn.value || "with that number") + ". Check the slide.";
        id = v;
        renderStart();
        return;
      }
      err = "";
      id = v;
      ses = found;
      try { localStorage.setItem(WHO, id); } catch (e) {}
      loadLocal();
      renderPoll();
    }
    document.getElementById("go").addEventListener("click", go);
    [nid, sn].forEach(el => el.addEventListener("keydown", e => { if (e.key === "Enter") go(); }));
  }

  function renderPoll() {
    hdr.textContent = ses.id + " · " + ses.title;
    const n = ses.questions.filter(q => saved[q.id]).length;
    let html = '<div class="who"><span>NetID <strong>' + id + "</strong></span>" +
      '<button type="button" id="change">Change</button></div>';
    html += '<div class="count">' + n + " of " + ses.questions.length + " saved. Each tap saves.</div>";
    if (err) html += '<div class="card err">' + err + "</div>";
    ses.questions.forEach(q => {
      html += '<div class="q card"><h2><span class="n">Q' + q.n + ".</span> " + md(q.prompt) + "</h2>";
      LETTERS.forEach(L => {
        const on = answers[q.id] === L ? " on" : "";
        html += '<button type="button" class="opt' + on + '" data-q="' + q.id + '" data-l="' + L + '"><span class="ltr">' + L + "</span> " + md(q.choices[L]) + "</button>";
      });
      if (saved[q.id]) html += '<p class="ok">Saved: ' + saved[q.id] + "</p>";
      html += "</div>";
    });
    html += '<div class="bar"><button type="button" id="done">Done</button></div>';
    appEl.innerHTML = html;
    document.getElementById("done").addEventListener("click", renderDone);
    document.getElementById("change").addEventListener("click", () => { err = ""; renderStart(); });
    appEl.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => vote(btn.getAttribute("data-q"), btn.getAttribute("data-l")));
    });
  }

  function renderDone() {
    const n = ses.questions.filter(q => saved[q.id]).length;
    let html = '<div class="card">';
    if (n) {
      html += '<p class="ok">Your answers are saved (' + n + " of " + ses.questions.length + ").</p>";
      html += '<p class="msg">You can close this page. To change an answer, come back before the end of class.</p>';
    } else {
      html += '<p class="err">You have not answered anything yet.</p>';
    }
    html += '<div style="margin-top:0.8rem"><button type="button" class="primary" id="back">Back to the questions</button></div>';
    html += "</div>";
    appEl.innerHTML = html;
    window.scrollTo(0, 0);
    document.getElementById("back").addEventListener("click", renderPoll);
  }

  function vote(qid, letter) {
    answers[qid] = letter;
    err = "";
    renderPoll();
    if (!db) {
      err = "Voting is not connected. Tell the TA.";
      renderPoll();
      return;
    }
    // One key per question, so a later vote never erases an earlier one.
    const payload = { updated: firebase.database.ServerValue.TIMESTAMP };
    payload["choices/" + qid] = letter;
    db.ref("votes/" + ses.id + "/" + id).update(payload)
      .then(() => {
        saved[qid] = letter;
        saveLocal();
        renderPoll();
      })
      .catch(() => {
        answers[qid] = saved[qid];
        err = "Not saved. " + ses.id + " takes votes only during class on its class day. Check the session number.";
        renderPoll();
      });
  }

  fetch("polls.json").then(r => r.json()).then(data => {
    polls = data;
    if (cfg.apiKey && cfg.databaseURL) {
      firebase.initializeApp(cfg);
      db = firebase.database();
    }
    renderStart();
  }).catch(() => {
    appEl.innerHTML = '<div class="card msg">Could not load the poll questions.</div>';
  });
})();
  </script>
</body>
</html>
