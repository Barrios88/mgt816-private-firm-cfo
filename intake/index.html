<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>MGT 816 · Before Wednesday</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --navy: #00356B;
      --ink: #1a1a1a;
      --muted: #5c6770;
      --line: #d5dde6;
      --bg: #eef1f4;
      --card: #fff;
      --ok: #157347;
      --bad: #b02a37;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      background: var(--navy);
      color: #fff;
      padding: 0.95rem 1rem calc(0.95rem + env(safe-area-inset-top));
      padding-top: calc(0.95rem + env(safe-area-inset-top));
    }
    header .kicker { font-size: 0.78rem; opacity: 0.85; letter-spacing: 0.04em; text-transform: uppercase; }
    header h1 { margin: 0.2rem 0 0; font: 650 1.35rem Georgia, "Times New Roman", serif; }
    header .sub { margin-top: 0.35rem; font-size: 0.92rem; opacity: 0.92; max-width: 36rem; line-height: 1.4; }
    main { max-width: 38rem; margin: 0 auto; padding: 0.9rem 0.85rem 2.8rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.95rem 1rem;
      margin-bottom: 0.75rem;
    }
    .msg { color: var(--muted); line-height: 1.45; margin: 0; }
    .err { color: var(--bad); font-weight: 650; margin: 0.55rem 0 0; }
    h2 { font: 650 1.05rem Georgia, "Times New Roman", serif; margin: 0 0 0.35rem; }
    label.q {
      display: block;
      font-weight: 650;
      font-size: 0.92rem;
      margin: 0.85rem 0 0.35rem;
      line-height: 1.35;
    }
    .hint { font-weight: 500; color: var(--muted); font-size: 0.84rem; }
    input[type="text"], textarea {
      width: 100%;
      min-height: 2.7rem;
      font: inherit;
      padding: 0.5rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    textarea { min-height: 5.2rem; resize: vertical; line-height: 1.4; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
    @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
    .pills { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .pill, .skill button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      font: 650 0.9rem inherit;
      cursor: pointer;
      min-height: 2.55rem;
      padding: 0.4rem 0.7rem;
    }
    .pill.on, .skill button.on {
      border-color: var(--navy);
      background: #e7eef6;
      color: var(--navy);
    }
    .pill:disabled { opacity: 0.4; cursor: not-allowed; }
    .check { display: block; margin: 0.35rem 0; font-size: 0.92rem; }
    .check input { margin-right: 0.45rem; }
    .topics { display: grid; gap: 0.35rem; }
    .topic {
      display: flex; align-items: flex-start; gap: 0.55rem;
      width: 100%; text-align: left;
      border: 1px solid var(--line); background: #fff; border-radius: 8px;
      padding: 0.55rem 0.65rem; cursor: pointer; font: 500 0.9rem inherit;
    }
    .topic.on { border-color: var(--navy); background: #e7eef6; font-weight: 650; }
    .topic:disabled { opacity: 0.4; cursor: not-allowed; }
    .topic .n { color: var(--navy); font-weight: 700; min-width: 1.4rem; }
    .skill { margin: 0.85rem 0 1.05rem; }
    .skill p { margin: 0 0 0.35rem; font-weight: 650; font-size: 0.92rem; }
    .skill .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.28rem; }
    .skill button { min-height: 2.7rem; padding: 0.3rem 0.2rem; font-size: 0.78rem; }
    .steps { display: flex; gap: 0.35rem; margin-bottom: 0.75rem; }
    .steps span {
      flex: 1; height: 0.35rem; border-radius: 99px; background: #d5dde6;
    }
    .steps span.on { background: var(--navy); }
    .bar {
      position: sticky; bottom: 0; background: var(--bg);
      padding: 0.65rem 0 calc(0.65rem + env(safe-area-inset-bottom));
      display: flex; gap: 0.45rem;
    }
    .bar button {
      flex: 1; min-height: 3rem; border: 0; border-radius: 10px;
      background: var(--navy); color: #fff; font: 700 1.02rem inherit; cursor: pointer;
    }
    .bar button.ghost {
      background: #fff; color: var(--navy); border: 1px solid var(--line); flex: 0 0 7.2rem;
    }
    .bar button:disabled { opacity: 0.45; cursor: not-allowed; }
    .count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.84rem; margin: 0 0 0.45rem; }
    .done h2 { font-size: 1.25rem; }
    .done p { line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <div class="kicker">MGT 816 · The Private Firm CFO</div>
    <h1>Before Wednesday</h1>
    <div class="sub">This takes about four minutes and is not graded. I read every response before Wednesday and use them to set the pace for Friday’s bootcamp.</div>
  </header>
  <main id="app"></main>
  <script src="../live/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-database-compat.js"></script>
  <script>
(function () {
  const SCHEMA = "mgt816-intake-2026-v2";
  const STORE = "mgt816-intake-2026";
  const cfg = window.MGT816_FIREBASE || {};
  const appEl = document.getElementById("app");

  const SKILLS = [
    { id: "captable", label: "Built or edited a cap table (pre/post-money, dilution)" },
    { id: "equity", label: "Option grants, 83(b), ISO vs NQSO" },
    { id: "kpis", label: "CAC, churn, LTV" },
    { id: "revrec", label: "Revenue recognition (ASC 606)" },
    { id: "terms", label: "Term sheets, prefs, SAFEs" },
    { id: "excel", label: "Excel model with linked tabs" },
    { id: "ai", label: "Used ChatGPT / Claude / Gemini / Copilot on a spreadsheet or model (not for writing)" }
  ];
  const SKILL_LABELS = ["Never", "Heard of it", "Once", "At work", "Could teach"];
  const TOPICS = [
    { id: "s01_burn", n: "S01", label: "Burn, runway, startup books" },
    { id: "s02_cap", n: "S02", label: "Cap tables" },
    { id: "s03_legal", n: "S03", label: "Entity, employees vs contractors" },
    { id: "s04_feedburner", n: "S04", label: "Founder splits and vesting" },
    { id: "s05_equity", n: "S05", label: "Equity pay and tax" },
    { id: "s06_forecast", n: "S06", label: "KPIs and budgets" },
    { id: "s07_ai", n: "S07", label: "Forecasting with AI; catching bad numbers" },
    { id: "s09_revrec", n: "S09", label: "Rev rec for software" },
    { id: "s10_board", n: "S10", label: "Board packages and audit" },
    { id: "s11_raise", n: "S11", label: "Fundraising and venture debt" },
    { id: "s12_exit", n: "S12", label: "Selling the company" }
  ];
  const SEATS = [
    ["founder", "Founder / operator"],
    ["pe", "PE"],
    ["vc", "VC"],
    ["ib", "IB"],
    ["consulting", "Consulting"],
    ["fpna", "Corp finance / FP&A"],
    ["accounting", "Accounting / audit"],
    ["law", "Law"],
    ["product", "Product / eng / ops"],
    ["other", "Other"]
  ];
  const PRIVATE = [
    ["never", "Never"],
    ["intern", "Intern or project"],
    ["ft", "Full-time"],
    ["founded", "Founded or cofounded"]
  ];
  const JE = [
    ["past_year", "Past year"],
    ["y1_3", "1–3 years ago"],
    ["y3_plus", "More than 3 years ago"],
    ["never", "Never"]
  ];
  const DEST = [
    ["pe", "PE investing"],
    ["pe_ops", "PE ops / portco"],
    ["vc", "VC"],
    ["founder", "Founder / startup"],
    ["startup_cfo", "Private-company finance"],
    ["ib", "IB"],
    ["consulting", "Consulting"],
    ["corp", "Corp strategy / FP&A"],
    ["accounting", "Accounting"],
    ["undecided", "Undecided"]
  ];
  const PROGRAMS = [
    ["mba27", "MBA 2027"],
    ["mba28", "MBA 2028"],
    ["mam", "MAM"],
    ["emba", "EMBA"],
    ["phd", "PhD"],
    ["other_yale", "Other Yale"],
    ["cross", "Cross-registered"]
  ];
  const empty = {
    nameFirst: "", nameLast: "", netid: "", section: "", program: "",
    seats: [], seatOther: "", privateCo: "", jeRecency: "",
    skills: {}, excelDesk: false, aiLogin: false, needPair: false,
    wants: [], struggle: "", oct14: "",
    destination: ""
  };
  let data = load();
  let step = 0;
  let db = null;
  let saving = false;
  let saved = false;
  let err = "";

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORE) || "null");
      if (raw && typeof raw === "object") {
        const out = Object.assign({}, empty, raw);
        out.skills = Object.assign({}, empty.skills, raw.skills || {});
        out.wants = Array.isArray(raw.wants) ? raw.wants : [];
        out.seats = Array.isArray(raw.seats) ? raw.seats : (raw.seat ? [raw.seat] : []);
        return out;
      }
    } catch (e) {}
    return Object.assign({}, empty, { skills: {}, wants: [], seats: [] });
  }
  function persist() { localStorage.setItem(STORE, JSON.stringify(data)); }
  function normalizeNetid(raw) {
    let s = String(raw || "").trim().toLowerCase();
    if (s.endsWith("@yale.edu")) s = s.slice(0, -9);
    return s;
  }
  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function pills(name, options, current) {
    let html = '<div class="pills">';
    options.forEach(([id, label]) => {
      html += '<button type="button" class="pill' + (current === id ? " on" : "") + '" data-f="' + name + '" data-v="' + id + '">' + label + "</button>";
    });
    html += "</div>";
    return html;
  }
  function multiPills(name, options, selected, max) {
    const sel = selected || [];
    let html = '<div class="pills">';
    options.forEach(([id, label]) => {
      const on = sel.indexOf(id) !== -1;
      const disable = !on && sel.length >= max;
      html += '<button type="button" class="pill' + (on ? " on" : "") + '"' + (disable ? " disabled" : "") + ' data-multi="' + name + '" data-v="' + id + '">' + label + "</button>";
    });
    html += "</div>";
    return html;
  }

  function validStep0() {
    const id = normalizeNetid(data.netid);
    if (!data.nameFirst.trim() || !data.nameLast.trim()) return "Enter your first and last name.";
    if (!id || id.indexOf("@") !== -1 || id.indexOf(".") !== -1 || id.indexOf(" ") !== -1) return "Enter your Yale NetID (the username you use to log in to Canvas), not your email address.";
    if (!/^[a-z][a-z0-9]{1,20}$/.test(id)) return "That does not look like a Yale NetID.";
    if (!data.section) return "Pick your section.";
    if (!data.program) return "Pick your program.";
    if (!data.seats.length) return "Pick at least one previous role.";
    if (data.seats.indexOf("other") !== -1 && !String(data.seatOther || "").trim()) return "Describe the other role.";
    if (!data.privateCo) return "Answer the private-company question.";
    if (!data.jeRecency) return "Answer the journal-entry question.";
    return "";
  }
  function validStep1() {
    for (let i = 0; i < SKILLS.length; i++) {
      if (!data.skills[SKILLS[i].id]) return "Rate all seven skills.";
    }
    if (!data.excelDesk && !data.aiLogin && !data.needPair) return "Check at least one of the September 28 boxes.";
    return "";
  }
  function validStep2() {
    if (data.wants.length !== 3) return "Pick exactly three topics.";
    if (!data.struggle) return "Pick the topic you expect to be hardest.";
    if (!String(data.oct14 || "").trim()) return "Finish the “By October 14” sentence.";
    return "";
  }
  function validStep3() {
    if (!data.destination) return "Pick the job you are aiming for.";
    return "";
  }
  const validators = [validStep0, validStep1, validStep2, validStep3];

  function payload() {
    const netid = normalizeNetid(data.netid);
    const skills = {};
    SKILLS.forEach(s => { skills[s.id] = Number(data.skills[s.id] || 0); });
    return {
      schema: SCHEMA,
      netid: netid,
      nameFirst: data.nameFirst.trim(),
      nameLast: data.nameLast.trim(),
      section: data.section,
      program: data.program,
      seats: data.seats.slice(),
      seat: data.seats[0] || "",
      seatOther: data.seats.indexOf("other") !== -1 ? String(data.seatOther || "").trim() : "",
      privateCo: data.privateCo,
      jeRecency: data.jeRecency,
      skills: skills,
      logistics: {
        excelDesk: !!data.excelDesk,
        aiLogin: !!data.aiLogin,
        needPair: !!data.needPair
      },
      wants: data.wants.slice(),
      struggle: data.struggle,
      oct14: String(data.oct14 || "").trim().slice(0, 280),
      destination: data.destination,
      updated: Date.now()
    };
  }

  function render() {
    if (saved) {
      appEl.innerHTML = '<div class="card done"><h2>Thanks. Your answers are saved.</h2><p class="msg">See you Wednesday in Evans 4430. Bring a name tent. Friday, September 4 is a required class (Yale runs a Monday schedule that day). Case 1 goes out Wednesday.</p><p class="msg" style="margin-top:0.7rem">If you want to change your answers, open this page again and resubmit.</p></div>';
      return;
    }
    const titles = ["You", "Skills", "What you want", "Next job"];
    let html = '<div class="steps">' + [0,1,2,3].map(i => '<span' + (i <= step ? ' class="on"' : "") + "></span>").join("") + "</div>";
    html += '<div class="card"><h2>' + titles[step] + "</h2>";
    if (step === 0) html += screen0();
    if (step === 1) html += screen1();
    if (step === 2) html += screen2();
    if (step === 3) html += screen3();
    if (err) html += '<p class="err">' + esc(err) + "</p>";
    html += "</div>";
    html += '<div class="bar">';
    if (step > 0) html += '<button type="button" class="ghost" id="back">Back</button>';
    html += '<button type="button" id="next"' + (saving ? " disabled" : "") + ">" + (saving ? "Saving…" : (step === 3 ? "Submit" : "Continue")) + "</button>";
    html += "</div>";
    appEl.innerHTML = html;
    bind();
  }

  function screen0() {
    let h = '<p class="msg">Use the name you will put on your name tent. Your NetID is the username you use to log in to Canvas (for example, jmb432).</p>';
    h += '<div class="grid2"><div><label class="q" for="nameFirst">First name</label><input id="nameFirst" type="text" autocomplete="given-name" value="' + esc(data.nameFirst) + '"></div>';
    h += '<div><label class="q" for="nameLast">Last name</label><input id="nameLast" type="text" autocomplete="family-name" value="' + esc(data.nameLast) + '"></div></div>';
    h += '<label class="q" for="netid">Yale NetID</label><input id="netid" type="text" inputmode="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="jmb432" value="' + esc(data.netid) + '">';
    h += '<label class="q">Section</label>' + pills("section", [["01", "01 · 1:00"], ["02", "02 · 2:35"], ["G1", "G1 · 4:10"]], data.section);
    h += '<label class="q">Program</label>' + pills("program", PROGRAMS, data.program);
    h += '<label class="q">Where have you worked before? <span class="hint">pick up to 2</span></label>' + multiPills("seats", SEATS, data.seats, 2);
    if (data.seats.indexOf("other") !== -1) {
      h += '<label class="q" for="seatOther">Describe the other role</label><input id="seatOther" type="text" value="' + esc(data.seatOther) + '">';
    }
    h += '<label class="q">Have you worked at a private or VC-backed company?</label>' + pills("privateCo", PRIVATE, data.privateCo);
    h += '<label class="q">When did you last write a journal entry yourself?</label>' + pills("jeRecency", JE, data.jeRecency);
    h += '<p class="msg" style="margin-top:0.85rem">Two dates to check now: Friday, September 4 is a required class (Yale runs a Monday schedule that day), and the final exam is Friday, October 16, 5:30–8:30 pm. If either is a problem for you, say so in the one-sentence box on the “What you want” screen.</p>';
    return h;
  }
  function screen1() {
    let h = '<p class="msg">For each item, pick the answer that fits best. This is not a résumé; an honest answer is more useful to me than an impressive one.</p>';
    SKILLS.forEach(s => {
      const cur = String(data.skills[s.id] || "");
      h += '<div class="skill"><p>' + s.label + '</p><div class="row">';
      SKILL_LABELS.forEach((lab, i) => {
        const n = String(i + 1);
        h += '<button type="button" class="' + (cur === n ? "on" : "") + '" data-skill="' + s.id + '" data-n="' + n + '">' + lab + "</button>";
      });
      h += "</div></div>";
    });
    h += '<label class="q">September 28 is a laptop class (the AI forecasting workshop). Check each statement that is true for you.</label>';
    h += '<label class="check"><input type="checkbox" id="excelDesk"' + (data.excelDesk ? " checked" : "") + "> I have desktop Excel on a laptop I can bring (not Numbers, and not only Google Sheets)</label>";
    h += '<label class="check"><input type="checkbox" id="aiLogin"' + (data.aiLogin ? " checked" : "") + "> I have a working AI account (ChatGPT, Claude, Gemini, or Copilot; a free tier is fine)</label>";
    h += '<label class="check"><input type="checkbox" id="needPair"' + (data.needPair ? " checked" : "") + "> Neither of the above. I will need to pair up with someone that day.</label>";
    return h;
  }
  function screen2() {
    const n = data.wants.length;
    let h = '<p class="msg">Pick the three topics you most want extra time on. The course covers all of them; your picks decide where the spare minutes go.</p><p class="count">' + n + " of 3 selected</p>";
    h += '<div class="topics">';
    TOPICS.forEach(t => {
      const on = data.wants.indexOf(t.id) !== -1;
      const disable = !on && n >= 3;
      h += '<button type="button" class="topic' + (on ? " on" : "") + '"' + (disable ? " disabled" : "") + ' data-topic="' + t.id + '"><span class="n">' + t.n + "</span> " + t.label + "</button>";
    });
    h += "</div>";
    h += '<label class="q">Which of these do you expect to be hardest for you?</label>' + pills("struggle", TOPICS.map(t => [t.id, t.n + " " + t.label]), data.struggle);
    h += '<label class="q" for="oct14">Finish this sentence: “By October 14 I want to be able to…” <span class="hint">one sentence</span></label>';
    h += '<textarea id="oct14" maxlength="280" placeholder="build a Series A cap table without guessing">' + esc(data.oct14) + "</textarea>";
    return h;
  }
  function screen3() {
    let h = '<label class="q">Which job are you aiming for in the next one to three years?</label>' + pills("destination", DEST, data.destination);
    h += '<p class="msg" style="margin-top:0.85rem">Only I see these answers. Nothing here is shared with the class.</p>';
    return h;
  }

  function readFields() {
    ["nameFirst", "nameLast", "netid", "seatOther", "oct14"].forEach(id => {
      const el = document.getElementById(id);
      if (el) data[id] = el.value;
    });
    ["excelDesk", "aiLogin", "needPair"].forEach(id => {
      const el = document.getElementById(id);
      if (el) data[id] = !!el.checked;
    });
  }
  function bind() {
    appEl.querySelectorAll(".pill[data-f]").forEach(btn => {
      btn.addEventListener("click", () => {
        readFields();
        data[btn.getAttribute("data-f")] = btn.getAttribute("data-v");
        persist();
        render();
      });
    });
    appEl.querySelectorAll("[data-multi]").forEach(btn => {
      btn.addEventListener("click", () => {
        readFields();
        const id = btn.getAttribute("data-v");
        const i = data.seats.indexOf(id);
        if (i >= 0) data.seats.splice(i, 1);
        else if (data.seats.length < 2) data.seats.push(id);
        persist();
        render();
      });
    });
    appEl.querySelectorAll("[data-skill]").forEach(btn => {
      btn.addEventListener("click", () => {
        data.skills[btn.getAttribute("data-skill")] = btn.getAttribute("data-n");
        persist();
        render();
      });
    });
    appEl.querySelectorAll("[data-topic]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-topic");
        const i = data.wants.indexOf(id);
        if (i >= 0) data.wants.splice(i, 1);
        else if (data.wants.length < 3) data.wants.push(id);
        persist();
        render();
      });
    });
    const back = document.getElementById("back");
    if (back) back.addEventListener("click", () => { readFields(); persist(); step -= 1; err = ""; render(); });
    document.getElementById("next").addEventListener("click", goNext);
  }
  function goNext() {
    readFields();
    persist();
    const v = validators[step]();
    if (v) { err = v; render(); return; }
    err = "";
    if (step < 3) { step += 1; render(); return; }
    submit();
  }
  function submit() {
    const body = payload();
    if (!cfg.databaseURL) {
      err = "This form is not connected yet. Email john.m.barrios@yale.edu instead.";
      render();
      return;
    }
    saving = true;
    render();
    if (!db) {
      try {
        if (!firebase.apps.length) firebase.initializeApp(cfg);
        db = firebase.database();
      } catch (e) {
        saving = false;
        err = "Could not connect to the server. Try again, or email john.m.barrios@yale.edu.";
        render();
        return;
      }
    }
    db.ref("intake/responses/" + body.netid).set(body)
      .then(() => { saving = false; saved = true; persist(); render(); })
      .catch(() => {
        saving = false;
        err = "Could not save your answers. Check your NetID and try again.";
        render();
      });
  }

  render();
})();
  </script>
</body>
</html>
